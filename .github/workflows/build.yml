# =====================================================================================
#  CI: on every push / pull request, build + test everything and keep the release zips
#  as downloadable artifacts. Uses the SAME scripts you run locally (scripts/*.ps1).
#  GUIDE: docs/guide/16-build-and-package.md#ci
# =====================================================================================
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # main-branch builds push the coverage badge to the "badges" branch

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Integration tests need a real SQL Server.
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Passw0rd! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12

    env:
      TEST_CONNECTION_STRING: "Server=localhost,1433;Database=EmployeeDemoDb_Tests;User Id=sa;Password=Ci_Passw0rd!;TrustServerCertificate=True"
      DOTNET_NOLOGO: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package (build, test, publish, zip)
        shell: pwsh
        run: ./scripts/package-all.ps1 -Runtime linux-x64 -ApiBaseUrl "${{ vars.API_BASE_URL || 'http://localhost:5080' }}"

      # Turn the Cobertura XML from `dotnet test` into an HTML report, a Markdown summary
      # (shown on the run page) and SVG badges. EF migrations are generated code: excluded.
      - name: Coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"artifacts/coverage/**/coverage.cobertura.xml" \
            -targetdir:artifacts/coverage-report \
            -reporttypes:"HtmlInline;MarkdownSummaryGithub;Badges" \
            -filefilters:"-**/Migrations/**"
          cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # README badge: the SVG lives on its own "badges" branch (one commit, force-pushed)
      # so it never adds noise to main's history. Only main updates it, not PRs.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp artifacts/coverage-report/badge_linecoverage.svg "$RUNNER_TEMP/coverage.svg"
          cd "$RUNNER_TEMP"
          git init -q badges && cd badges
          cp ../coverage.svg coverage.svg
          git add coverage.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: artifacts/coverage-report

      - name: Upload release zips
        uses: actions/upload-artifact@v4
        with:
          name: employee-demo-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/release-info.json
